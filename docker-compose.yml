# Docker Compose configuration for Music Streaming API
# Usage: docker-compose up -d

version: '3.8'

services:
  # ==========================================================================
  # Web Application
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookalike-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=lookalike_db
      - DATABASE_USER=lookalike_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-lookalike_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - lookalike-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: lookalike-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=lookalike_db
      - POSTGRES_USER=lookalike_user
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-lookalike_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lookalike-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookalike_user -d lookalike_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis (Cache & Message Broker)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: lookalike-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - lookalike-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Celery Worker (Background Tasks)
  # ==========================================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookalike-celery
    restart: unless-stopped
    command: celery -A spotify worker -l INFO --concurrency=2
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=lookalike_db
      - DATABASE_USER=lookalike_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-lookalike_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis
    networks:
      - lookalike-network

  # ==========================================================================
  # Celery Beat (Scheduled Tasks)
  # ==========================================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookalike-celery-beat
    restart: unless-stopped
    command: celery -A spotify beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=lookalike_db
      - DATABASE_USER=lookalike_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-lookalike_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
      - celery
    networks:
      - lookalike-network

  # ==========================================================================
  # Elasticsearch (Search Engine)
  # ==========================================================================
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: lookalike-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lookalike-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Daphne ASGI Server (WebSocket Support)
  # ==========================================================================
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookalike-websocket
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8001 spotify.asgi:application
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web,websocket
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=lookalike_db
      - DATABASE_USER=lookalike_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-lookalike_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lookalike-network

  # ==========================================================================
  # Nginx Reverse Proxy (Production)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: lookalike-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - lookalike-network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  logs:
    driver: local

# ==========================================================================
# Networks
# ==========================================================================
networks:
  lookalike-network:
    driver: bridge
